[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "massing"
version = "0.1.0"
description = "Turn 2D architectural floor plans (DXF) into reviewable 3D massing models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3",
  "shapely>=2.0",
  "numpy>=1.26",
  "pillow>=10",
  "scipy>=1.11",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
render = ["matplotlib>=3.8"]
step = ["build123d>=0.11,<0.12", "cadquery-ocp-novtk>=7.9,<8"]

[project.scripts]
massing = "massing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["massing*"]

[tool.setuptools.package-data]
massing = ["*.json", "*.js"]
